[project]
name = "literature-agent"
version = "0.1.0"
description = "A small, LLM-driven tool to collect, organize, and query research literature."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.79",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "platformdirs>=4.2",
]

[project.scripts]
lit = "lit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "real_cli_layer: exercises the `claude` subprocess plumbing; opts out of the conftest guard",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9", "B"]
# typer's entire API is `def cmd(x: T = typer.Option(...))`; B008 flags the
# idiom itself, not a bug.
ignore = ["B008"]
